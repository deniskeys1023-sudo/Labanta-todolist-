services:
  postgres15:
    container_name: postgres15
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      TZ: "Atlantic/Cape_Verde"
    networks:
      - todolist-network
    volumes:
      - pg15_data:/var/lib/postgresql/data/
    ports:
      - 5432:5432

  pgadmin4:
    image: dpage/pgadmin4:9.2
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - 5050:80
    restart: unless-stopped
    volumes:
      - pgadmin-2025:/var/lib/pgadmin

  todolist-app:
    container_name: todolist-app
    #build:
    image: todolist-app:0.0.0
    env_file:
      - .env
    networks:
      - todolist-network
    ports:
      - 3000:3000
    depends_on:
      - postgres15

networks:
  todolist-network:
    name: todolist-network
    external: true

volumes:
  pg15_data:
    name: pg15_data
  pgadmin-2025:
    name: pgadmin-2025